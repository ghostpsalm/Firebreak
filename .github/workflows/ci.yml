name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (for the x86_64-pc-windows-gnu target)
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The gate skips the collector's checks when Deno is missing, so CI
      # installs it — otherwise the one place that must never skip them
      # would be the place that silently did.
      - name: Install Deno (for the collector under server/)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run the gate
        run: ./scripts/gate.sh
