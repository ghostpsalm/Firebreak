ShortDescription: Firewall rule-usage auditor - finds unused and over-broad rules
Description: |-
  Firebreak correlates Windows Filtering Platform connection audit events
  (Security log 5156/5157) with the live WFP filter table and the firewall
  rule set, to show which rules real traffic actually exercises. It runs,
  reports and exits - no service, no driver. Requires administrator rights:
  every read in its evidence loop is admin-bound.
